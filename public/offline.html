<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Offline · Sticky Monkey</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#0f1420;color:#e8ecf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  img{width:88px;height:88px;border-radius:20px;margin-bottom:16px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#8a93a6;font-size:14px;margin:0 0 20px}
  button{background:#f5d020;color:#111;border:0;border-radius:10px;padding:10px 20px;font-weight:700;font-size:14px}
</style>
</head>
<body>
  <div>
    <img src="/pwa-icons/192.png" alt="">
    <h1>You're offline</h1>
    <p>Sticky Monkey needs a connection to load your data.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
